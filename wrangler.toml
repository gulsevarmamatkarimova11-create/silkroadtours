# Cloudflare Worker config for the OpenNext adapter.
# Next.js is built by `opennextjs-cloudflare build` into .open-next/ and deployed
# as a Worker with static assets (Cloudflare's current recommended target for
# Next.js — it replaces the deprecated @cloudflare/next-on-pages flow).

name = "silkroad-tours"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Lets OpenNext call back into this same Worker (needed for ISR / revalidation).
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "silkroad-tours"

# ── Database ──────────────────────────────────────────────────────────────
# Create once with:  npx wrangler d1 create silkroad-tours-db
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "silkroad-tours-db"
database_id = "REPLACE_WITH_OUTPUT_OF_wrangler_d1_create"
migrations_dir = "drizzle/migrations"

# ── Non-secret runtime vars ──────────────────────────────────────────────
# Secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, SESSION_SECRET, ADMIN_SECRET,
# TURNSTILE_SECRET_KEY) are NEVER put here. Set them with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
# and locally in .dev.vars (see .dev.vars.example).
[vars]
SITE_URL = "https://silkroad-tours.example.workers.dev"
DEFAULT_CURRENCY = "USD"
BOOKING_REF_PREFIX = "UZ"

[observability]
enabled = true
head_sampling_rate = 1
