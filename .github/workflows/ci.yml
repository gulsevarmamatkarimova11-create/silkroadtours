# Runs on every push: type check, unit tests, schema check, Cloudflare build,
# then starts the built app locally (Workers runtime + local D1) and runs the smoke test,
# the Playwright end-to-end + accessibility suite and the Lighthouse budgets.
# It never deploys and needs no secrets.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:8787
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Database schema matches migrations
        run: python3 scripts/check-schema-parity.py

      - name: Build for Cloudflare (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Create local database with seed data
        run: |
          npm run db:migrate:local
          npm run db:seed:local

      - name: Local test secrets (random, test-only)
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN="
            echo "TELEGRAM_CHAT_ID="
            echo "SESSION_SECRET=$(openssl rand -base64 32)"
            echo "ADMIN_SECRET=$(openssl rand -base64 32)"
            echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA"
          } > .dev.vars

      - name: Start the built app
        run: |
          npx opennextjs-cloudflare preview > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/health > /dev/null; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "App did not start:"; cat preview.log; exit 1

      - name: Smoke test
        run: BASE_URL=http://localhost:8787 npm run test:smoke

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests (desktop + mobile 390x844)
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8787

      - name: Lighthouse budgets (home, /tours, a tour page)
        run: |
          # workerd's preview does not compress responses; Cloudflare's edge does in production.
          node scripts/compress-proxy.mjs > proxy.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8788/api/health > /dev/null && break; sleep 1; done
          npx lhci autorun || { node scripts/lighthouse-summary.mjs; exit 1; }
          node scripts/lighthouse-summary.mjs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
          include-hidden-files: true

      - name: Show app log on failure
        if: failure()
        run: tail -n 150 preview.log || true
