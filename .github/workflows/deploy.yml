# Deploys to Cloudflare Workers + D1.
#
# Runs:
#   - by hand: GitHub → Actions → "Deploy" → Run workflow (you can tick "seed" on the very first run), or
#   - automatically after the "Test" workflow succeeds for a push to main.
#
# Needs (see docs/DEPLOYMENT.md):
#   repository SECRETS:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   repository VARIABLES: SITE_URL (e.g. https://silkroadtours.uz), TURNSTILE_SITE_KEY
#   wrangler.toml:        the real D1 database_id
# If anything is missing, the first step fails with instructions and nothing is deployed.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "First deploy only: load the 9 destinations, 18 tours and FAQ into the empty production database"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Manual runs always; automatic runs only after a successful Test run triggered by a push to main.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # After an automatic trigger, deploy exactly the commit that passed the tests.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check that deployment is configured
        run: |
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing+=("repository secret CLOUDFLARE_API_TOKEN (DEPLOYMENT.md step 3)")
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=("repository secret CLOUDFLARE_ACCOUNT_ID (DEPLOYMENT.md step 3)")
          [ -z "$SITE_URL" ] && missing+=("repository variable SITE_URL (DEPLOYMENT.md step 6)")
          [ -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ] && missing+=("repository variable TURNSTILE_SITE_KEY (DEPLOYMENT.md step 5)")
          grep -q "REPLACE_WITH_OUTPUT_OF_wrangler_d1_create" wrangler.toml && missing+=("the real database_id in wrangler.toml (DEPLOYMENT.md step 4)")
          case "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" in 1x0000*|2x0000*|3x0000*) missing+=("a production Turnstile site key — the test key is set (DEPLOYMENT.md step 5)");; esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Deployment is not configured yet::Nothing was deployed. Missing: $(IFS='; '; echo "${missing[*]}"). Follow docs/DEPLOYMENT.md."
            exit 1
          fi
          echo "Configuration looks complete."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Apply database migrations (production D1)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: d1 migrations apply silkroad-tours-db --remote

      - name: Load the starter catalogue (first deploy only)
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        run: |
          # Insert-only: fails safely without changing anything if tours already exist.
          npm run db:seed:build
          npx wrangler d1 execute silkroad-tours-db --remote --file=drizzle/seed.sql

      - name: Build for Cloudflare Workers (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: deploy --var SITE_URL:${{ vars.SITE_URL }}

      - name: Check the live site
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$SITE_URL/api/health" > /dev/null; then echo "✅ $SITE_URL is up"; exit 0; fi
            sleep 6
          done
          echo "::warning::Deployed, but $SITE_URL/api/health did not answer yet. If you use a custom domain, check DEPLOYMENT.md step 9."
